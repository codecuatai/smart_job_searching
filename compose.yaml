services:
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    environment:
      AI_PORT: ${AI_PORT:-8001}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('AI_PORT','8001') + '/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-8000}
      WEB_PORT: ${WEB_PORT:-3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:${AI_PORT:-8001}}
      DATABASE_PATH: /app/var/data/unitalent.db
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo12345}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - api_data:/app/var/data
    depends_on:
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('API_PORT','8000') + '/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: ${API_URL:-http://api:${API_PORT:-8000}}
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.WEB_PORT || '3000') + '/api/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
volumes:
  api_data:
    name: ${DATA_VOLUME:-unitalent_data}
    external: ${DATA_VOLUME_EXTERNAL:-false}
