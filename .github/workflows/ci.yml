name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/check-staged.mjs --all
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python scripts/benchmark_matching.py
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npm run env:init
      - name: Run required offline Docker E2E
        env:
          E2E_AI_MODE: offline
        run: npm run docker:test
      - name: Preserve offline report
        if: always()
        run: test ! -d artifacts/e2e || cp -R artifacts/e2e artifacts/e2e-offline
      - name: Check live Gemini configuration
        id: gemini
        shell: bash
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is configured; running live AI E2E."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is not configured; live AI E2E will be skipped."
          fi
      - name: Run Docker E2E with live Gemini
        if: steps.gemini.outputs.configured == 'true'
        env:
          E2E_AI_MODE: live
        run: npm run docker:test
      - name: Report skipped live AI E2E
        if: steps.gemini.outputs.configured != 'true'
        run: echo 'Skipped live AI E2E. Add the GEMINI_API_KEY repository secret to enable it.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            artifacts/e2e/
            artifacts/e2e-offline/
          include-hidden-files: true
          retention-days: 7
      - run: docker compose -p unitalent-test down
        if: always()
