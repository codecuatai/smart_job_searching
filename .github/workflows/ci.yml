name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/check-staged.mjs --all
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: python scripts/benchmark_matching.py
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npm run env:init
      - name: Require real Gemini for AI E2E
        run: test -n "$GEMINI_API_KEY" || (echo 'Configure GEMINI_API_KEY repository secret for live AI E2E.' && exit 1)
      - run: npm run docker:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: artifacts/e2e/
          include-hidden-files: true
          retention-days: 7
      - run: docker compose -p unitalent-test down
        if: always()
