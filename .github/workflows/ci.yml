name: Verify
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/check-staged.mjs --all
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run env:init
      - run: docker compose -p unitalent-e2e up --build -d --wait
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: artifacts/e2e/
          include-hidden-files: true
          retention-days: 7
      - run: docker compose -p unitalent-e2e down --volumes
        if: always()
